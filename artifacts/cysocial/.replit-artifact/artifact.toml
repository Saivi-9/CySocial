kind = "web"
previewPath = "/"
title = "CySocial — Kıbrıs Sosyal Medya Ajansı"
version = "1.0.0"
id = "artifacts/cysocial"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20335

[services.development]
run = "pnpm --filter @workspace/cysocial run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cysocial", "run", "build" ]
serve = "static"
publicDir = "artifacts/cysocial/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20335"
BASE_PATH = "/"
